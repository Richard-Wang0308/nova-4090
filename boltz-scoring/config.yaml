# Configuration for Boltz Scoring

# Protein selection
protein_selection:
  weekly_target: "P23977"  # Target protein code (UniProt ID)
  antitarget: "H6AQJ3"     # Antitarget protein code (UniProt ID)

# Protein constraints (for target only)
protein_constraints:
  binding_pocket: null      # List of residue numbers that define the binding pocket
  max_distance: null         # Maximum distance from pocket center, in angstroms
  force: false              # Whether to force the constraint (default: False for soft guidance)

# Molecule validation and scoring parameters
molecule_validation:
  # Number of molecules to validate with Boltz2
  num_molecules_boltz: 1
  # Metric to use for scoring
  boltz_metric: ["affinity_probability_binary", "affinity_pred_value"]
  # Combination strategy: "heavy_atom_normalization" or "average"
  combination_strategy: "heavy_atom_normalization"
  # Sample selection: "random" or "first"
  sample_selection: "first"

# Molecule to score (single molecule)
molecule:
  name: "molecule_1"
  smiles: "Cc1cccc2cc(NC(C)c3cnc4[nH]ncc4c3)cnc12"  # Example: ethanol

