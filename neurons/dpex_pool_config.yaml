# ════════════════════════════════════════════════════════════════
# DPEX_DJA Pool Configuration for Boltz-2
# ════════════════════════════════════════════════════════════════
# 
# This file controls pool sizes and related parameters.
# No code changes needed - just update values here!
#

# ── POOL SIZES ──────────────────────────────────────────────────
pool:
  # Population A: Global exploration pool
  # Larger = better elite diversity for DJA
  # Recommended: 1200 for Boltz-2, 200 for Psychic
  pop_A_size: 1200
  
  # Population B: Local refinement pool
  # Larger = better neighborhoods for Tabu search
  # Recommended: 1000 for Boltz-2, 100 for Psychic
  pop_B_size: 1000
  
  # Elite pool: Top molecules to keep in memory
  # Used for quality filtering and DJA updates
  elite_pool_size: 700
  
  # Stagger offset for pop_B selection
  # Prevents complete overlap with pop_A
  # pop_B starts at: molecules_df[pop_B_start : pop_B_start + pop_B_size]
  pop_B_start_offset: 100


# ── TABU LIST SIZES ─────────────────────────────────────────────
tabu:
  # Tabu list A: Forbidden moves in exploration
  # Larger pools need larger tabu lists
  # Rule: tabu_size ≈ 0.125 * pop_A_size
  tabu_A_maxlen: 150
  
  # Tabu list B: Forbidden moves in refinement
  tabu_B_maxlen: 150
  
  # Tabu list C: General forbidden moves
  tabu_C_maxlen: 150


# ── CANDIDATE GENERATION ────────────────────────────────────────
candidates:
  # Seed phase (iteration 1-2): Initial exploration
  seed_budget: 80
  
  # Early phase (iteration 3-10): Build momentum
  early_budget: 100
  
  # Normal phase (iteration 11+): Steady state
  normal_budget: 80
  
  # Stagnation phase: When improvement is low
  stagnation_budget: 60
  
  # DJA/Tabu split in early phase
  dja_ratio_early: 0.60      # 60% DJA, 40% Tabu
  tabu_ratio_early: 0.40
  
  # DJA/Tabu split in stagnation phase
  dja_ratio_stagnation: 0.30  # 30% DJA, 70% Tabu (shift to refinement)
  tabu_ratio_stagnation: 0.70


# ── QUALITY FILTERING ───────────────────────────────────────────
quality_filter:
  # Minimum similarity to any elite molecule (Tanimoto)
  # Range: 0.0 - 1.0
  # Lower = more diverse candidates, higher = more similar to elites
  min_similarity_to_elite: 0.55
  
  # Minimum diversity between filtered candidates
  # Range: 0.0 - 1.0
  # Higher = more diverse candidates (slower filtering)
  diversity_threshold: 0.65
  
  # Tolerance for duplicates (InChIKey matching)
  # Molecules within this similarity are considered duplicates
  duplication_tolerance: 0.05


# ── STAGNATION DETECTION ────────────────────────────────────────
stagnation:
  # Window size for stagnation detection
  # Check last N iterations for improvement
  window_size: 3
  
  # Minimum improvement threshold
  # If improvement < this, count as stagnation
  improvement_threshold: 0.001
  
  # Iterations without improvement before activating exploit mode
  exploit_mode_threshold: 3


# ── SCORING PARAMETERS ──────────────────────────────────────────
scoring:
  # Cost per molecule in seconds (for time estimation)
  # Psychic: ~5-10s
  # Boltz-2: ~30-60s
  cost_per_molecule: 30.0
  
  # Batch size for Boltz-2 scoring
  # Larger = faster but more memory
  batch_size: 10
  
  # Maximum molecules to score per iteration
  max_molecules_per_iteration: 100


# ── DJA PARAMETERS ──────────────────────────────────────────────
dja:
  # Probability of adopting best solution's component
  # Range: 0.0 - 1.0
  # Higher = more exploitation of best solutions
  best_adoption_probability: 0.60
  
  # Probability of escaping worst solution's component
  # Range: 0.0 - 1.0
  escape_probability: 0.50
  
  # Use elite diversity (top/bottom 10% instead of single best/worst)
  use_elite_diversity: true
  
  # Elite percentage for diversity
  # Use top/bottom N% of population
  elite_percentage: 0.10


# ── TABU ALGORITHM PARAMETERS ──────────────────────────────────
# NOTE: This is SEPARATE from the 'tabu' section (which is tabu list sizes)
tabu_algo:
  # Minimum similarity for finding "similar" components
  # Range: 0.0 - 1.0
  min_similarity_for_neighbors: 0.50
  
  # Number of similar components to consider
  num_similar_components: 5
  
  # Aspiration criteria: Allow tabu move if it beats best by this %
  # Range: 0.0 - 1.0 (as percentage)
  aspiration_threshold: 0.97


# ── EXPLOIT MODE PARAMETERS ─────────────────────────────────────
exploit:
  # Minimum similarity threshold for exploit mode
  # Find components highly similar to best molecule
  min_similarity_threshold: 0.70
  
  # Number of similar components to explore
  num_similar_to_explore: 10
  
  # Percentage of budget allocated to exploit mode
  budget_percentage: 0.20


# ── LOGGING & DEBUG ─────────────────────────────────────────────
logging:
  # Verbosity level: DEBUG, INFO, WARNING, ERROR
  level: INFO
  
  # Log pool statistics every N iterations
  stats_interval: 5
  
  # Log detailed candidate generation info
  verbose_generation: false
  
  # Log filtering statistics
  verbose_filtering: true